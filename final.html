<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Tahoma, sans-serif; background: radial-gradient(circle at top, #3b1028, #140914 38%, #050507 100%); color: #ffffff; }
        .card { position: relative; isolation: isolate; padding: 42px 50px; text-align: center; background: #0c0a0f; border: 2px solid transparent; border-radius: 24px; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55), 0 0 28px rgba(255, 45, 133, 0.2); }
        @property --border-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
        .card::before { content: ""; position: absolute; z-index: -2; inset: -4px; border-radius: 27px; background: conic-gradient(from var(--border-angle), #ffffff 0deg, rgba(255, 255, 255, 0.12) 45deg, transparent 95deg, transparent 230deg, #ff2d85 275deg, #ffffff 320deg, #ffffff 360deg); animation: borderLight 2.5s linear infinite; box-shadow: 0 0 14px rgba(255, 255, 255, 0.85), 0 0 25px rgba(255, 45, 133, 0.7); }
        .card::after { content: ""; position: absolute; z-index: -1; inset: 0; border-radius: 22px; background: #0c0a0f; }
        h1 { margin: 0 0 20px; font-size: clamp(2rem, 3vw, 3rem); color: #ffffff; text-shadow: 0 0 12px rgba(255, 45, 133, 0.75); }
        @keyframes borderLight { to { --border-angle: 360deg; } }
        p { margin: 0; font-size: 1.1rem; line-height: 1.8; color: #f9a8d4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>i love my phech</h1>
        <p>ขอบคุณที่เดินทางด้วยกันมานาน<br>สุขสันต์วันครบรอบนะหมู</p>
    </div>
</body>
</html>
