<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at top, #3b1028, #140914 38%, #050507 100%);
            color: #ffffff;
            text-align: center;
        }
        .happy-box {
            position: relative;
            isolation: isolate;
            width: min(100%, 520px);
            padding: 48px 32px;
            background: #0c0a0f;
            border-radius: 24px;
            border: 1px solid rgba(255, 45, 133, 0.45);
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.6), 0 0 32px rgba(255, 45, 133, 0.24);
        }
        .heart {
            font-size: 3.5rem;
            color: #ff2d85;
            margin-bottom: 20px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 16px;
            color: #ffffff;
            text-shadow: 0 0 14px rgba(255, 45, 133, 0.65);
        }
        p {
            font-size: 1.15rem;
            color: #f9a8d4;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .next-btn {
            display: inline-block;
            padding: 13px 36px;
            border-radius: 999px;
            background: linear-gradient(135deg, #be185d, #ff2d85);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(255, 45, 133, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(255, 45, 133, 0.48);
        }
    </style>
</head>
<body>
    <main class="happy-box">
        <div class="heart">💖</div>
        <h1>เย้! เค้าก็รักเธอเหมือนกัน</h1>
        <p>มีอะไรจะให้ดูต่อด้วยนะ กดปุ่มด้านล่างได้เลย ✨</p>
        <a href="next.html" class="next-btn">ไปดูกันเลย ➜</a>
    </main>
</body>
</html>
