<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: "Segoe UI", Tahoma, sans-serif; 
            background: radial-gradient(circle at top, #3b1028, #140914 38%, #050507 100%); 
            color: #ffffff; 
        }
        .login-box { 
            width: 100%; 
            max-width: 420px; 
            padding: 32px 28px; 
            background: rgba(12, 10, 15, 0.94); 
            border: 1px solid rgba(255, 45, 133, 0.45); 
            border-radius: 20px; 
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 28px rgba(255, 45, 133, 0.2); 
        }
        .login-box h2 { margin: 0 0 8px; text-align: center; color: #ffffff; }
        .subtitle { margin: 0 0 24px; text-align: center; color: #f9a8d4; font-size: 0.97rem; }
        .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 0.96rem; display: none; }
        .alert-error { background: #3f1027; color: #fecdd3; border: 1px solid #fb7185; }
        form, .field { display: flex; flex-direction: column; gap: 8px; }
        form { gap: 16px; }
        label { font-weight: 600; color: #ffffff; }
        input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #831843; 
            border-radius: 10px; 
            background: #0b0a0e; 
            color: #ffffff; 
            font-size: 1rem; 
        }
        input:focus { 
            outline: none; 
            border-color: #ff2d85; 
            box-shadow: 0 0 0 4px rgba(255, 45, 133, 0.16); 
        }
        .password-hint { margin: 0; color: #f9a8d4; font-size: 0.88rem; }
        .btn { 
            padding: 12px 18px; 
            border: none; 
            border-radius: 10px; 
            background: linear-gradient(135deg, #be185d, #ff2d85); 
            color: #ffffff; 
            font-size: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
        }
        .btn:hover { 
            transform: translateY(-1px); 
            box-shadow: 0 8px 20px rgba(255, 45, 133, 0.35); 
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>เข้าสู่ระบบ</h2>
        <p class="subtitle">กรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
        
        <div id="error-alert" class="alert alert-error"></div>

        <form id="login-form">
            <div class="field">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" required>
                <p class="password-hint">คำใบ้: วันครบรอบ (แค่ตัวเลขเท่านั้นตามด้วยค.ศ.)</p>
            </div>
            <button type="submit" class="btn">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const passwordInput = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('error-alert');

            if (passwordInput === '') {
                alertBox.textContent = 'กรุณากรอกรหัสผ่าน';
                alertBox.style.display = 'block';
            } else if (passwordInput === '01012025') {
                alertBox.style.display = 'none';
                window.location.href = 'welcome.html';
            } else {
                alertBox.textContent = 'รหัสผ่านไม่ถูกต้อง';
                alertBox.style.display = 'block';
            }
        });
    </script>
    <a href="next.html" class="next-btn">ถัดไป</a>
</body>
</html>
