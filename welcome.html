<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Tahoma, sans-serif; background: radial-gradient(circle at top, #3b1028, #140914 38%, #050507 100%); color: #ffffff; }
        .card { padding: 40px 50px; text-align: center; background: rgba(12, 10, 15, 0.94); border: 1px solid rgba(255, 45, 133, 0.45); border-radius: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55), 0 0 28px rgba(255, 45, 133, 0.2); }
        h1 { margin: 0 0 10px; font-size: 2.2rem; color: #ffffff; }
        p { margin: 0 0 24px; font-size: 1.05rem; color: #f9a8d4; }
        .next-btn { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #be185d, #ff2d85); color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 700; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .next-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(255, 45, 133, 0.35); }
    </style>
</head>
<body>
    <div class="card">
        <h1>ยินดีต้อนรับ</h1>
        <p>เข้าสู่ระบบสำเร็จแล้ว</p>
        
    </div>
</body>
</html>
